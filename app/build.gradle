plugins {
    id 'com.android.application'
}

android {
    namespace 'com.customchess'
    compileSdk 35

    defaultConfig {
        applicationId 'com.customchess'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '27.2.12479018'
}

dependencies {
}
